services:
  - type: web
    name: the-win-list
    runtime: static
    repo: https://github.com/Abheydeep/Habit-Ledger
    branch: release/daily-driver-v1
    buildCommand: npm install && npm run verify:release
    staticPublishPath: ./out
    routes:
      - type: redirect
        source: /habit-tracker
        destination: /habit-tracker/
      - type: redirect
        source: /habit-tracker-no-sign-up
        destination: /habit-tracker-no-sign-up/
      - type: redirect
        source: /offline-habit-tracker
        destination: /offline-habit-tracker/
      - type: redirect
        source: /habit-tracker-for-students
        destination: /habit-tracker-for-students/
      - type: redirect
        source: /habit-tracker-for-working-professionals
        destination: /habit-tracker-for-working-professionals/
      - type: redirect
        source: /about
        destination: /about/
      - type: redirect
        source: /contact
        destination: /contact/
      - type: redirect
        source: /privacy-policy
        destination: /privacy-policy/
      - type: redirect
        source: /terms
        destination: /terms/
      - type: redirect
        source: /launch
        destination: /launch/
      - type: redirect
        source: /reel
        destination: /reel/
    domains:
      - www.mywinlist.com
