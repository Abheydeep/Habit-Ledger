services:
  - type: web
    name: the-win-list
    runtime: static
    repo: https://github.com/Abheydeep/Habit-Ledger
    branch: release/daily-driver-v1
    buildCommand: npm install && npm run verify:release
    staticPublishPath: ./out
    routes:
      - type: rewrite
        source: /habit-tracker
        destination: /habit-tracker.html
      - type: rewrite
        source: /habit-tracker-no-sign-up
        destination: /habit-tracker-no-sign-up.html
      - type: rewrite
        source: /offline-habit-tracker
        destination: /offline-habit-tracker.html
      - type: rewrite
        source: /habit-tracker-pwa
        destination: /habit-tracker-pwa.html
      - type: rewrite
        source: /habit-tracker-for-students
        destination: /habit-tracker-for-students.html
      - type: rewrite
        source: /habit-tracker-for-working-professionals
        destination: /habit-tracker-for-working-professionals.html
      - type: rewrite
        source: /habit-tracker-for-homemakers
        destination: /habit-tracker-for-homemakers.html
      - type: rewrite
        source: /rest-day-habit-tracker
        destination: /rest-day-habit-tracker.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /launch
        destination: /launch.html
      - type: rewrite
        source: /reel
        destination: /reel.html
      - type: rewrite
        source: /*
        destination: /index.html
    domains:
      - www.mywinlist.com
